<div class="flex min-h-dvh flex-col">
  <header class="bg-indigo-700 text-white shadow">
    <div class="mx-auto flex max-w-6xl flex-wrap items-center gap-x-6 gap-y-2 px-4 py-3">
      <a routerLink="/" class="flex items-center gap-2 text-lg font-bold tracking-tight">
        <span class="grid size-8 place-items-center rounded-lg bg-white text-indigo-700">K</span>
        KadreeBank
      </a>

      <nav class="flex gap-1 text-sm">
        @if (session.isLoggedIn()) {
          <a
            routerLink="/accounts"
            routerLinkActive="bg-indigo-800"
            class="rounded-md px-3 py-1.5 hover:bg-indigo-600"
            >Mis cuentas</a
          >
        }
        <a
          routerLink="/reports"
          routerLinkActive="bg-indigo-800"
          class="rounded-md px-3 py-1.5 hover:bg-indigo-600"
          >Reportes</a
        >
      </nav>

      <div class="ml-auto flex items-center gap-3 text-sm">
        @if (session.customer(); as customer) {
          <span class="hidden text-indigo-100 sm:inline">{{ customer.fullName }}</span>
          <button
            type="button"
            (click)="logout()"
            class="rounded-md bg-indigo-800 px-3 py-1.5 font-medium hover:bg-indigo-900"
          >
            Salir
          </button>
        } @else {
          <a routerLink="/login" class="rounded-md bg-white px-3 py-1.5 font-medium text-indigo-700"
            >Ingresar</a
          >
        }
      </div>
    </div>
  </header>

  <main class="mx-auto w-full max-w-6xl flex-1 px-4 py-8">
    <router-outlet />
  </main>

  <footer class="py-6 text-center text-xs text-slate-400">KadreeBank · Prueba técnica</footer>
</div>
